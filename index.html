
<script type="module">
    // 1. 匯入 Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-analytics.js";
    import {
        getDatabase,
        ref,
        push,
        onChildAdded
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

    // 2. Firebase 專案設定
    const firebaseConfig = {
          apiKey: "AIzaSyC3IhPshI7nKddCKa8YAjUHOimqCEtOALk",
          authDomain: "my-chat-room-22d07.firebaseapp.com",
          projectId: "my-chat-room-22d07",
          storageBucket: "my-chat-room-22d07.firebasestorage.app",
          messagingSenderId: "215467459535",
          appId: "1:215467459535:web:f9dd8ef20eda907cc548ba",
          measurementId: "G-HRGBYCXGVC"
    };

    // 3. 初始化 Firebase
    const app = initializeApp(firebaseConfig);

    // Analytics 僅在瀏覽器環境支援時初始化
    if (typeof window !== "undefined") {
        try {
            const analytics = getAnalytics(app);
        } catch (error) {
            console.warn("Analytics 初始化失敗：", error);
        }
    }

    // 4. 連接 Realtime Database
    const db = getDatabase(app);
    const messagesRef = ref(db, "chat_messages");

    // 5. 取得 HTML 元素
    const chatBox = document.getElementById("chat-box");
    const usernameInput = document.getElementById("username");
    const messageInput = document.getElementById("message");
    const sendBtn = document.getElementById("send-btn");

    // 6. 傳送訊息
    async function sendMessage() {
        const name = usernameInput.value.trim() || "路人";
        const text = messageInput.value.trim();

        if (text === "") return;

        sendBtn.disabled = true;

        try {
            await push(messagesRef, {
                username: name,
                message: text,
                timestamp: Date.now()
            });

            messageInput.value = "";
        } catch (error) {
            console.error("訊息傳送失敗：", error);
            alert("訊息傳送失敗，請檢查資料庫設定與權限。");
        } finally {
            sendBtn.disabled = false;
        }
    }

    // 7. 綁定按鈕與 Enter 鍵
    sendBtn.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    // 8. 監聽新訊息
    onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();

        const msgDiv = document.createElement("div");
        msgDiv.classList.add("msg");

        const nameSpan = document.createElement("span");
        nameSpan.classList.add("name");
        nameSpan.textContent = `${data.username ?? "路人"}:`;

        const textSpan = document.createElement("span");
        textSpan.textContent = data.message ?? "";

        msgDiv.appendChild(nameSpan);
        msgDiv.appendChild(textSpan);
        chatBox.appendChild(msgDiv);

        chatBox.scrollTop = chatBox.scrollHeight;
    }, (error) => {
        console.error("監聽訊息失敗：", error);
    });
</script>
