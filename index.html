
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase 簡易聊天室</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 10px;
        }

        #chat-box {
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }

        .msg {
            margin-bottom: 8px;
            padding: 6px;
            border-radius: 4px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            overflow-wrap: anywhere;
        }

        .name {
            font-weight: bold;
            color: #333;
            margin-right: 5px;
        }

        input, button {
            box-sizing: border-box;
            padding: 8px;
            font-size: 16px;
        }

        #username { width: 22%; }
        #message { width: 53%; }
        button { width: 22%; cursor: pointer; }
    </style>
</head>

<body>
    <h2>💬 3-5 人測試聊天室</h2>

    <!-- HTML 畫面：JavaScript 會尋找這些 ID -->
    <div id="chat-box"></div>

    <div>
        <input type="text" id="username" placeholder="名字" value="路人">
        <input type="text" id="message" placeholder="輸入訊息...">
        <button id="send-btn">傳送</button>
    </div>

    <!-- Firebase 新版模組 -->
    <script type="module">
        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

        import { getAnalytics }
            from "https://www.gstatic.com/firebasejs/12.5.0/firebase-analytics.js";

        import {
            getDatabase,
            ref,
            push,
            onChildAdded
        } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

        // Firebase 專案設定
        const firebaseConfig = {
            apiKey: "AIzaSyC3IhPshI7nKddCKa8YAjUHOimqCEtOALk",
            authDomain: "my-chat-room-22d07.firebaseapp.com",

            // 請從 Firebase Console → Realtime Database
            // 複製實際的資料庫網址並填入下方
            databaseURL: "https://my-chat-room-22d07-default-rtdb.firebaseio.com/",

            projectId: "my-chat-room-22d07",
            storageBucket: "my-chat-room-22d07.firebasestorage.app",
            messagingSenderId: "215467459535",
            appId: "1:215467459535:web:f9dd8ef20eda907cc548ba",
            measurementId: "G-HRGBYCXGVC"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);

        // Analytics 是選用功能；不支援時不影響聊天室核心功能
        if (typeof window !== "undefined") {
            try {
                getAnalytics(app);
            } catch (error) {
                console.warn("Analytics 初始化失敗：", error);
            }
        }

        // 連接 Realtime Database
        const db = getDatabase(app);
        const messagesRef = ref(db, "chat_messages");

        // 取得 HTML 元素
        const chatBox = document.getElementById("chat-box");
        const usernameInput = document.getElementById("username");
        const messageInput = document.getElementById("message");
        const sendBtn = document.getElementById("send-btn");

        // 傳送訊息
        async function sendMessage() {
            const name = usernameInput.value.trim() || "路人";
            const text = messageInput.value.trim();

            if (!text) return;

            sendBtn.disabled = true;

            try {
                await push(messagesRef, {
                    username: name,
                    message: text,
                    timestamp: Date.now()
                });

                messageInput.value = "";
                messageInput.focus();
            } catch (error) {
                console.error("傳送失敗：", error);
                alert("傳送失敗，請檢查資料庫網址與存取權限。");
            } finally {
                sendBtn.disabled = false;
            }
        }

        // 按鈕與 Enter 鍵
        sendBtn.addEventListener("click", sendMessage);

        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        // 接收新訊息
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();

            const msgDiv = document.createElement("div");
            msgDiv.classList.add("msg");

            const nameSpan = document.createElement("span");
            nameSpan.classList.add("name");
            nameSpan.textContent = `${data.username ?? "路人"}:`;

            const textSpan = document.createElement("span");
            textSpan.textContent = data.message ?? "";

            msgDiv.appendChild(nameSpan);
            msgDiv.appendChild(textSpan);
            chatBox.appendChild(msgDiv);

            chatBox.scrollTop = chatBox.scrollHeight;
        }, (error) => {
            console.error("讀取訊息失敗：", error);
        });
    </script>
</body>
</html>
